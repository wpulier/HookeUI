id = "basic-bright-objects"
name = "Bright objects"
runs = "cpu"
version = "bright-regions/1"
licence = ["basic-bright-objects"]
kind = "tool-function"
what = "Finds bright regions using a basic local threshold method"
runner = "builtin-cpu"
source = { made_here = "Bundled application algorithm; no model weights", url = "https://docs.opencv.org/4.x/d7/d4d/tutorial_py_thresholding.html" }
needs_to_get = []
needs_to_run = []
credit = { authors = "ObservationUI contributors; OpenCV contributors", link = "https://opencv.org/" }
component = { what = "OpenCV threshold and connected-component routines", licence = "Apache-2.0 (OpenCV); application adapter follows the application licence", url = "https://github.com/opencv/opencv/blob/4.x/LICENSE", tier = "open" }
workers = []
host = "shared"
documented_mb = 32
load_limit_s = 5
# The capability contract (catalog format 2, ADR 0024): its settings were the constants of orchestrator/bright_objects.py,
# declared here with the same defaults, so its output is unchanged; now they are a form in Actions and Try, and the
# agent's. Ported from the parallel one-door branch (#316).
requires = { catalog = 2 }
operation = "cells"
category = "Find"
search_aliases = ["bright spots", "bright regions", "threshold", "otsu"]
outcomes = { empty = "no region is brighter than the background", unsupported = "a picture that isn't one 8-bit grey or RGB plane" }
# The bundled Human cells example (assets/examples, CC0-1.0, David Root): 271 regions, as tests/bright_objects_reference.py
# finds independently.
tests = [{ input = "example-human-cells.png", outcome = "result", count = 271 }]

[[inputs]]
id = "image"
type = "image.2d.rgb8"
label = "Picture"

[[inputs]]
id = "sigma"
type = "number"
default = 1.0
min = 0.1
max = 5.0
step = 0.1
unit = "px"
label = "Smoothing"
tooltip = "The Gaussian blur's sigma (a 5 by 5 kernel) before the threshold"

[[inputs]]
id = "min_area"
type = "int"
default = 20
min = 1
max = 1000000
unit = "px²"
label = "Smallest object"
tooltip = "Regions smaller than this are left out"

[[inputs]]
id = "connectivity"
type = "choice"
options = [8, 4]
default = 8
label = "Joined when"
tooltip = "8: touching at a corner joins two regions; 4: only touching at an edge does"
advanced = true

[[outputs]]
id = "regions"
type = "labels.instance.2d"
label = "Bright regions (not cells)"
tooltip = "Bright regions are not a cell count"
