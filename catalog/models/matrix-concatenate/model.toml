# App-owned file capability; matrix_capability_runs performs retained-file admission.
# The ordinary RGB path refuses these types. Readiness comes from the shared matrix descriptor.
requires = { catalog = 2 }
id = "matrix-concatenate"
name = "Join count matrices"
runs = "cpu"
version = "1"
licence = ["matrix-concatenate"]
kind = "tool-function"
what = "Join raw-count rows with identical ordered genes and unique cell identities"
runner = "builtin-cpu"
source = { made_here = "General explicit count and response operations; no pretrained weights" }
credit = { authors = "HookeUI contributors; NumPy, SciPy and scverse contributors", link = "https://anndata.readthedocs.io/" }
component = { what = "Bundled scientific count operation", licence = "Apache-2.0 adapter; dependencies retain their own licenses", url = "https://github.com/wpulier/HookeUI", tier = "open" }
needs_to_get = []
needs_to_run = ["install:matrix-cpu-runtime"]
workers = []
host = "shared"
documented_mb = 512
load_limit_s = 30
operation = "matrix-concatenate"
category = "Research"
experimental = true
outcomes = { empty = "No input observations", unsupported = "An unqualified runtime, incompatible scientific meaning or excessive resource request" }

[[inputs]]
id = "left"
type = "matrix.anndata"
label = "First count matrix"

[[inputs]]
id = "right"
type = "matrix.anndata"
label = "Second count matrix"

[[inputs]]
id = "context_column"
type = "string"
default = "context"
label = "Context column"

[[inputs]]
id = "target_column"
type = "string"
default = "target_gene"
label = "Target column"

[[inputs]]
id = "maximum_cell_counts"
type = "int"
default = 1000000
min = 1
max = 100000000
label = "Maximum counts per cell"

[[inputs]]
id = "maximum_stored_entries"
type = "int"
default = 25000000000
min = 1
max = 100000000000
label = "Maximum stored entries"

[[outputs]]
id = "result"
type = "matrix.anndata"
label = "Retained joined counts"
