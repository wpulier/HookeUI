# App-owned file capability; matrix_capability_runs performs retained-file admission.
# The ordinary RGB path refuses these types. Readiness comes from the shared matrix descriptor.
requires = { catalog = 2 }
id = "response-predict"
name = "Generate conditional counts"
runs = "cpu"
version = "3"
licence = ["response-predict"]
kind = "tool-function"
what = "Generate reproducible counts from fitted effects and control cells"
runner = "builtin-cpu"
source = { made_here = "General explicit count and response operations; no pretrained weights" }
credit = { authors = "HookeUI contributors; NumPy, SciPy and scverse contributors", link = "https://anndata.readthedocs.io/" }
component = { what = "Bundled scientific count operation", licence = "Apache-2.0 adapter; dependencies retain their own licenses", url = "https://github.com/wpulier/HookeUI", tier = "open" }
needs_to_get = []
needs_to_run = ["install:matrix-cpu-runtime"]
workers = []
host = "shared"
documented_mb = 512
load_limit_s = 30
operation = "response-predict"
category = "Research"
experimental = true
outcomes = { empty = "No input observations", unsupported = "An unqualified runtime, incompatible scientific meaning or excessive resource request" }

[[inputs]]
id = "model"
type = "artifact.response-model"
label = "Model"

[[inputs]]
id = "controls"
type = "matrix.anndata"
label = "Controls"

[[inputs]]
id = "panel"
type = "artifact.target-panel"
label = "Panel"

[[inputs]]
id = "context_column"
type = "string"
default = "context"
label = "Context Column"

[[inputs]]
id = "target_column"
type = "string"
default = "target_gene"
label = "Target Column"

[[inputs]]
id = "control_label"
type = "string"
default = "non-targeting"
label = "Control Label"

[[inputs]]
id = "cells_per_target"
type = "int"
default = 100
label = "Cells Per Target"
tooltip = "Used for a target-list panel. An explicit target-count panel supplies each target's count instead, in every context."
min = 1
max = 10000

[[inputs]]
id = "seed"
type = "int"
default = 0
label = "Seed"
min = 0
max = 2147483647

[[inputs]]
id = "response_strength"
type = "number"
default = 1
label = "Response Strength"
min = 0
max = 2

[[inputs]]
id = "dispersion_estimator"
type = "choice"
default = "normalized-moments-v1"
options = ["normalized-moments-v1", "depth-scaled-poisson-v1"]
label = "Dispersion estimator"
tooltip = "Keep normalized moments, or explicitly test depth-scaled Poisson-noise subtraction. Neither establishes biological fidelity."

[[inputs]]
id = "dispersion_shrinkage"
type = "number"
default = 20
label = "Dispersion Shrinkage"
min = 0
max = 10000

[[inputs]]
id = "maximum_cell_counts"
type = "int"
default = 1000000
label = "Maximum Cell Counts"
min = 1
max = 16777216

[[inputs]]
id = "effect_interpretation"
type = "choice"
default = "proportional-fold-v1"
options = ["proportional-fold-v1", "pseudocount-inverse-v1"]
label = "Effect interpretation"
tooltip = "Proportional fold is an approximation; inverse requires fitted normalization and reports negative-expression projection."

[[outputs]]
id = "result"
type = "matrix.anndata"
label = "Retained result"
