<!doctype html><html lang="en" data-workspace-theme="dark"><meta charset="utf-8"><title>Document in its Tab · deterministic UI fixture</title>

<!-- Design evidence only (W5, documents): the production Data reader (data-reader.ts) in a reader Tab, as
     workspace-study.ts mounts it on the Stage, showing a document the Assistant wrote from a Project's records

<style>
 body{margin:0;background:var(--mm-page);color:var(--mm-text);font:13px var(--mm-sans);-webkit-font-smoothing:antialiased;overflow:hidden}
 .fx-top{position:fixed;inset:0 0 auto 0;height:44px;box-shadow:inset 0 -1px 0 var(--mm-line);display:flex;align-items:center;padding-left:86px;font:600 13px var(--mm-sans)}

 .fx-tabs span{height:36px;display:flex;align-items:center;padding:0 12px;border-radius:8px 8px 0 0;color:var(--mm-text-2)}
 .fx-tabs span[aria-current]{background:var(--mm-bar);color:var(--mm-text)}

const values={media:'document',title:'Leaf epidermis: findings so far',leftOut:{paragraphs:0,cites:0},document:{title:'Leaf epidermis: findings so far',sections:[
 {heading:'What the sample appears to be',paragraphs:[{text:'Researcher 1 reported that the jigsaw-shaped pavement cells and kidney-shaped guard cells suggest the abaxial epidermis of a dicot leaf. This is Researcher 1’s interpretation. No other record confirms the leaf side or the plant group, so both remain open.',cites:[cite('r1','Researcher 1’s notes')]}]},
 {heading:'Cells and stomata counted',paragraphs:[
  {text:'Hooke outlined 61 cells in the leaf epidermis view with Cellpose-SAM, and 58 of them are still in place. In the count of the view, 7 of the 61 cells were stomata (guard-cell pairs). This is a count of saved outlines in one view, not a biological ground truth.',cites:[cite('e3','Leaf epidermis cells · 14:02'),cite('d4','Count · 14:03')]},
