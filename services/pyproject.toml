[project]
name = "microscope-mind-services"
version = "0.1.0"
description = "Realtime perception, scene, and AI agents for HookeUI"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "Pillow>=11",  # local scientific presentation/imports; independent of GPU/provider groups
    "opencv-python-headless>=4.11",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "scipy>=1.14",  # masks_from_labels (find_objects) and movement.py; before, only a non-commercial group brought it
    "pint==0.26.1",  # shared scientific unit-name identity; never implicit value conversion
]

[dependency-groups]
agent-client = ["mcp==2.3.0"]  # optional stdio transport; never installed by a research task
dev = ["pytest>=8.3", "pytest-xdist>=3.6", "h5py>=3.12"]  # pytest-xdist: `make test` runs the suite on every core; h5py: synthetic BigDataViewer fixtures (tests/test_bdv_reader.py)
cloud = ["google-genai>=2.28", "openai", "fal-client", "websockets", "keyring>=25"]  # keyring: keys the app saves go in the Keychain (orchestrator/secrets.py)
gpu = ["torch>=2.7", "transformers>=4.56", "timm>=1.0", "open-clip-torch>=3.3",
       "einops>=0.8"]  # einops: Molmo 2's own code (catalog/models/molmo2-4b) imports it; before, only sam3-setup brought it
# Packages for the noncommercial edition-policy tier (services/noncommercial/NOTICE, ADR 0005).
noncommercial = ["cellpose>=4"]
[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
